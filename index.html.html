<style>
:root{--bg:#0f172a;--p:#1e293b;--t:#e2e8f0;--m:#94a3b8;--b:#334155}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--t);height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:8px 14px;background:var(--p);border-bottom:1px solid var(--b);flex-wrap:wrap}
h1{font-size:17px;margin:0}.sp{flex:1}
button,select,input{background:#0b1220;color:var(--t);border:1px solid var(--b);border-radius:6px;padding:6px 9px;font:inherit}
button{cursor:pointer}button.on{background:#2563eb;border-color:#2563eb}
.kpis{display:flex;gap:8px;padding:8px 14px;overflow-x:auto}
.k{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:6px 10px;min-width:120px}
.k b{font-size:18px;display:block}.bar{height:5px;background:#0b1220;border-radius:3px;margin-top:4px}.bar i{display:block;height:100%;border-radius:3px}
.fl{display:flex;gap:8px;padding:0 14px 8px;flex-wrap:wrap;align-items:center}
main{flex:1;min-height:0;position:relative;margin:0 14px 14px}
#map,#tbl{position:absolute;inset:0;border-radius:8px}#tbl{overflow:auto;background:var(--p);display:none}
table{border-collapse:collapse;width:100%}th,td{padding:5px 8px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#0b1220}td.c{text-align:center}
.lg{position:absolute;right:10px;bottom:10px;z-index:999;background:var(--p);padding:8px;border-radius:8px;font-size:12px}
.lg span{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.pop label{display:block;margin:3px 0;cursor:pointer}.pop{color:#111;min-width:190px}
.login{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center}
.login div{background:var(--p);padding:24px;border-radius:12px;text-align:center}
#ai{position:fixed;right:0;top:0;bottom:0;width:350px;background:var(--p);border-left:1px solid var(--b);z-index:1000;display:none;flex-direction:column}#ai.open{display:flex}
#msgs{flex:1;overflow:auto;padding:10px}.m{margin:6px 0;padding:7px 9px;border-radius:8px;background:#0b1220;font-size:13px}.m.u{background:#2563eb}.m button{margin:4px 4px 0 0}
#ai form{padding:8px}#ai input{width:100%}.modal{position:fixed;inset:0;background:#000a;z-index:2000;display:none;align-items:center;justify-content:center}.modal>div{background:var(--p);padding:18px;border-radius:12px;max-width:95vw}
